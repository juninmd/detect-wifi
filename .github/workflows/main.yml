name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mobile-test-and-build:
    name: Mobile (Flutter) - Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.1'
          channel: 'stable'

      - name: Install Mobile Dependencies
        run: cd mobile && flutter pub get

      - name: Mobile Lint
        run: cd mobile && flutter analyze

      - name: Mobile Unit Tests (100% Coverage Enforced)
        run: |
          cd mobile
          flutter test --coverage

          # Use lcov to check coverage
          # Fail if coverage is below 100% for domain and usecases
          # Simple verification for this script:
          coverage_file="coverage/lcov.info"
          if [ -f "$coverage_file" ]; then
            total_lines=$(grep -cv '^end_of_record$' $coverage_file || true)
            if [ "$total_lines" -eq 0 ]; then
                echo "Coverage not generated properly"
                exit 1
            fi

            # Simple check if there are any DA lines ending in ,0 (uncovered lines) in domain files
            uncovered_domain=$(grep -A 100 "SF:lib/domain/" $coverage_file | grep "^DA:[0-9]*,0" || true)
            if [ -n "$uncovered_domain" ]; then
              echo "Error: Test coverage for domain layer is below 100%."
              echo "Uncovered lines:"
              echo "$uncovered_domain"
              exit 1
            fi
            echo "Domain layer has 100% test coverage."
          else
            echo "Coverage file not found!"
            exit 1
          fi

      - name: Build Android APK
        run: cd mobile && flutter build apk --release

  backend-test-and-build:
    name: Backend (NestJS) - Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Backend Lint
        run: cd backend && npm run lint

      - name: Backend Unit Tests (100% Coverage Enforced)
        run: cd backend && npm run test:cov

      - name: Build Backend
        run: cd backend && npm run build
