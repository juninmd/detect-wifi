name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  mobile-ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run tests with coverage
        run: flutter test --coverage
      - name: Check coverage threshold (Domain & Use Cases)
        run: |
          sudo apt-get install -y lcov
          if [ -f coverage/lcov.info ]; then
            lcov --extract coverage/lcov.info 'lib/domain/*' -o coverage/domain_lcov.info
            COVERAGE=$(lcov --summary coverage/domain_lcov.info | grep "lines" | awk '{print $2}' | cut -d '%' -f 1)
            echo "Domain Coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 100" | bc -l) )); then
              echo "Error: Domain test coverage ($COVERAGE%) is less than 100%!"
              exit 1
            fi
          else
            echo "Error: coverage/lcov.info not found."
            exit 1
          fi
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  backend-ci:
    name: NestJS Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run tests with coverage
        run: npm run test:cov
      - name: Build
        run: npm run build
