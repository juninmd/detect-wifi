name: CI/CD Pipeline (Flutter & NestJS)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  mobile-ci:
    name: Flutter Mobile CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4

      - name: Check Mobile directory exists
        id: check_mobile
        run: |
          if [ -d "." ] && [ -f "pubspec.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Mobile directory or pubspec.yaml not found. Skipping Flutter steps."
          fi

      - name: Set up Flutter
        if: steps.check_mobile.outputs.exists == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        if: steps.check_mobile.outputs.exists == 'true'
        run: flutter pub get

      - name: Run Dart Analyzer (Lint)
        if: steps.check_mobile.outputs.exists == 'true'
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Run Unit Tests with Coverage
        if: steps.check_mobile.outputs.exists == 'true'
        run: flutter test --coverage

      - name: Enforce 100% Coverage (Domain & Usecases)
        if: steps.check_mobile.outputs.exists == 'true'
        run: |
          sudo apt-get install -y lcov
          if [ -d "coverage" ]; then
            lcov --extract coverage/lcov.info 'lib/domain/*' -o coverage/domain.info
            SUMMARY=$(lcov --summary coverage/domain.info 2>&1)
            echo "$SUMMARY"
            if echo "$SUMMARY" | grep -q "lines......: 100.0%"; then
              echo "Coverage requirement met: 100%"
            else
              echo "Error: Code coverage in domain layer is below 100%."
              exit 1
            fi
          fi

      - name: Upload Coverage to Codecov
        if: steps.check_mobile.outputs.exists == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./mobile/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Build APK (Android)
        if: steps.check_mobile.outputs.exists == 'true'
        run: flutter build apk --release

      - name: Upload APK Artifact
        if: steps.check_mobile.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  backend-ci:
    name: NestJS Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Check Backend directory exists
        id: check_backend
        run: |
          if [ -d "." ] && [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Backend directory or package.json not found. Skipping Node steps."
          fi

      - name: Set up Node.js
        if: steps.check_backend.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        if: steps.check_backend.outputs.exists == 'true'
        run: npm ci

      - name: Run ESLint
        if: steps.check_backend.outputs.exists == 'true'
        run: npm run lint

      - name: Run Unit Tests with Coverage
        if: steps.check_backend.outputs.exists == 'true'
        run: npm run test:cov

      - name: Upload Coverage to Codecov
        if: steps.check_backend.outputs.exists == 'true'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./backend/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

      - name: Build NestJS Worker
        if: steps.check_backend.outputs.exists == 'true'
        run: npm run build
